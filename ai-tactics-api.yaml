openapi: 3.0.3
info:
  title: AI游戏战术顾问智能体接口
  description: 向AI战术顾问提问，查询游戏攻略、武器、BOSS、载具相关内容，知识库无数据时不会编造内容
  version: 1.0.0
paths:
  /api/ai/tactics/question:
    post:
      summary: 向AI战术顾问提问
      description: 提交问题，AI检索本地知识库返回游戏攻略回答
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                  description: 用户提问内容
                  example: 帮我写一份游戏攻略
      responses:
        '200':
          description: 请求成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 响应码，200代表成功
                    example: 200
                  message:
                    type: string
                    description: 响应信息
                    example: success
                  data:
                    type: object
                    properties:
                      sessionId:
                        type: string
                        description: 会话ID
                        example: s091
                      reply:
                        type: string
                        description: AI返回的回答内容
                        example: 我可以帮你写攻略，但需要先知道具体是哪款游戏、哪个内容（BOSS / 武器 / 关卡 / 战术等）。
